<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太空侵略者</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(180deg, #0a0a23 0%, #1a1a3e 50%, #0d0d1b 100%);
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            border: 4px solid #4a9fff;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(74, 159, 255, 0.5);
        }
        #gameCanvas {
            display: block;
            background-color: #0a0a23;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: rgba(10, 10, 35, 0.95);
            text-align: center;
            z-index: 10;
            transition: opacity 0.3s;
        }
        #overlay.hidden {
            display: none;
        }
        #overlay h1 {
            font-size: 48px;
            color: #4a9fff;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(74, 159, 255, 0.8);
        }
        #overlay p {
            font-size: 20px;
            color: #8ac4ff;
            margin-bottom: 30px;
        }
        #finalScore {
            font-size: 42px;
            color: #4a9fff;
            margin: 20px 0;
            font-weight: bold;
            text-shadow: 0 0 15px rgba(74, 159, 255, 0.6);
        }
        #score {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 28px;
            color: #4a9fff;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(74, 159, 255, 0.5);
            z-index: 5;
        }
        .instruction {
            font-size: 16px;
            color: #5a7aa0;
            margin-top: 20px;
        }
        .restart-btn {
            padding: 15px 40px;
            font-size: 20px;
            background: #4a9fff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            font-family: 'Courier New', monospace;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(74, 159, 255, 0.5);
        }
        .restart-btn:hover {
            background: #2a7fdf;
            box-shadow: 0 0 25px rgba(74, 159, 255, 0.8);
        }
        .restart-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="score">分数: 0</div>
        <div id="overlay">
            <h1>🚀 太空侵略者</h1>
            <p id="start-message">按 空格键 开始游戏</p>
            <div id="final-score" style="display: none; font-size: 42px; color: #4a9fff; margin: 20px 0; font-weight: bold; text-shadow: 0 0 15px rgba(74, 159, 255, 0.6);"></div>
            <button id="restart-btn" class="restart-btn" style="display: none;">重新开始</button>
            <div class="instruction" id="instruction-text">提示: ← → 移动飞船，空格键 发射子弹</div>
        </div>
    </div>

    <script>
        // ==================== 初始化模块 ====================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const overlay = document.getElementById('overlay');
        const restartBtn = document.getElementById('restart-btn');
        const finalScoreDiv = document.getElementById('final-score');
        const startMessage = document.getElementById('start-message');
        const instructionText = document.getElementById('instruction-text');

        const CONFIG = {
            WIDTH: 800,
            HEIGHT: 600,
            PLAYER_SPEED: 7,
            BULLET_SPEED: 10,
            ENEMY_ROWS: 5,
            ENEMY_COLS: 11,
            ENEMY_WIDTH: 40,
            ENEMY_HEIGHT: 30,
            ENEMY_SPACING: 60,
            ENEMY_INITIAL_SPEED: 1,
            ENEMY_DROP_DISTANCE: 30,
            ENEMY_BULLET_SPEED: 5
        };

        const GameState = {
            READY: 'ready',
            PLAYING: 'playing',
            GAME_OVER: 'gameOver'
        };

        let gameState = GameState.READY;
        let score = 0;
        let animationId = null;
        let keys = {};

        const resources = {
            loaded: true
        };

        // ==================== 状态模块 ====================
        const gameStateManager = {
            setState(newState) {
                gameState = newState;
            },
            isPlaying() {
                return gameState === GameState.PLAYING;
            }
        };

        // ==================== 玩家模块 ====================
        const player = {
            x: CONFIG.WIDTH / 2 - 25,
            y: CONFIG.HEIGHT - 60,
            width: 50,
            height: 40,
            speed: CONFIG.PLAYER_SPEED,
            lastShotTime: 0,
            shootCooldown: 250,

            update() {
                if (keys['ArrowLeft'] && this.x > 0) {
                    this.x -= this.speed;
                }
                if (keys['ArrowRight'] && this.x + this.width < CONFIG.WIDTH) {
                    this.x += this.speed;
                }
            },

            draw() {
                ctx.save();
                
                ctx.fillStyle = '#4a9fff';
                ctx.beginPath();
                ctx.moveTo(this.x + 25, this.y);
                ctx.lineTo(this.x + 50, this.y + 40);
                ctx.lineTo(this.x + 35, this.y + 40);
                ctx.lineTo(this.x + 35, this.y + 50);
                ctx.lineTo(this.x + 15, this.y + 50);
                ctx.lineTo(this.x + 15, this.y + 40);
                ctx.lineTo(this.x, this.y + 40);
                ctx.closePath();
                ctx.fill();
                
                ctx.fillStyle = '#8ac4ff';
                ctx.beginPath();
                ctx.ellipse(this.x + 25, this.y + 20, 8, 12, 0, 0, Math.PI * 2);
                ctx.fill();
                
                if (Math.random() > 0.3) {
                    ctx.fillStyle = '#ff6b35';
                    ctx.beginPath();
                    ctx.moveTo(this.x + 20, this.y + 50);
                    ctx.lineTo(this.x + 25, this.y + 60 + Math.random() * 10);
                    ctx.lineTo(this.x + 30, this.y + 50);
                    ctx.fill();
                }
                
                ctx.restore();
            },

            reset() {
                this.x = CONFIG.WIDTH / 2 - 25;
                this.y = CONFIG.HEIGHT - 60;
                this.lastShotTime = 0;
            },

            getHitbox() {
                return {
                    x: this.x + 5,
                    y: this.y + 5,
                    width: this.width - 10,
                    height: this.height - 10
                };
            },

            canShoot() {
                const now = Date.now();
                return now - this.lastShotTime >= this.shootCooldown;
            },

            shoot() {
                if (this.canShoot()) {
                    this.lastShotTime = Date.now();
                    bullets.createPlayerBullet(this.x + 22, this.y);
                }
            }
        };

        // ==================== 子弹模块 ====================
        const bullets = {
            playerBullets: [],
            enemyBullets: [],

            reset() {
                this.playerBullets = [];
                this.enemyBullets = [];
            },

            createPlayerBullet(x, y) {
                this.playerBullets.push({
                    x: x,
                    y: y,
                    width: 6,
                    height: 15,
                    speed: CONFIG.BULLET_SPEED
                });
            },

            createEnemyBullet(x, y) {
                this.enemyBullets.push({
                    x: x,
                    y: y,
                    width: 6,
                    height: 15,
                    speed: CONFIG.ENEMY_BULLET_SPEED
                });
            },

            update() {
                for (let i = this.playerBullets.length - 1; i >= 0; i--) {
                    this.playerBullets[i].y -= this.playerBullets[i].speed;
                    if (this.playerBullets[i].y + this.playerBullets[i].height < 0) {
                        this.playerBullets.splice(i, 1);
                    }
                }

                for (let i = this.enemyBullets.length - 1; i >= 0; i--) {
                    this.enemyBullets[i].y += this.enemyBullets[i].speed;
                    if (this.enemyBullets[i].y > CONFIG.HEIGHT) {
                        this.enemyBullets.splice(i, 1);
                    }
                }
            },

            draw() {
                ctx.fillStyle = '#00ff88';
                for (const bullet of this.playerBullets) {
                    ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
                    ctx.shadowColor = '#00ff88';
                    ctx.shadowBlur = 10;
                    ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
                }
                
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#ff4444';
                for (const bullet of this.enemyBullets) {
                    ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
                    ctx.shadowColor = '#ff4444';
                    ctx.shadowBlur = 10;
                    ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
                }
                ctx.shadowBlur = 0;
            }
        };

        // ==================== 敌机 AI 模块 ====================
        const enemies = {
            list: [],
            direction: 1,
            speed: CONFIG.ENEMY_INITIAL_SPEED,
            lastShotTime: 0,
            shootInterval: 1500,

            init() {
                this.list = [];
                this.direction = 1;
                this.speed = CONFIG.ENEMY_INITIAL_SPEED;
                
                const startX = (CONFIG.WIDTH - (CONFIG.ENEMY_COLS * CONFIG.ENEMY_SPACING)) / 2;
                const startY = 50;
                
                for (let row = 0; row < CONFIG.ENEMY_ROWS; row++) {
                    for (let col = 0; col < CONFIG.ENEMY_COLS; col++) {
                        this.list.push({
                            x: startX + col * CONFIG.ENEMY_SPACING,
                            y: startY + row * CONFIG.ENEMY_SPACING,
                            width: CONFIG.ENEMY_WIDTH,
                            height: CONFIG.ENEMY_HEIGHT,
                            alive: true,
                            type: row < 1 ? 2 : row < 3 ? 1 : 0
                        });
                    }
                }
            },

            reset() {
                this.init();
                this.lastShotTime = 0;
            },

            update() {
                let shouldDrop = false;
                let minX = CONFIG.WIDTH;
                let maxX = 0;

                for (const enemy of this.list) {
                    if (enemy.alive) {
                        if (enemy.x < minX) minX = enemy.x;
                        if (enemy.x + enemy.width > maxX) maxX = enemy.x + enemy.width;
                    }
                }

                if (maxX >= CONFIG.WIDTH - 20 && this.direction === 1) {
                    shouldDrop = true;
                    this.direction = -1;
                } else if (minX <= 20 && this.direction === -1) {
                    shouldDrop = true;
                    this.direction = 1;
                }

                for (const enemy of this.list) {
                    if (enemy.alive) {
                        enemy.x += this.speed * this.direction;
                        if (shouldDrop) {
                            enemy.y += CONFIG.ENEMY_DROP_DISTANCE;
                        }
                    }
                }

                if (shouldDrop) {
                    this.speed *= 1.05;
                }

                const now = Date.now();
                if (now - this.lastShotTime > this.shootInterval) {
                    this.shoot();
                    this.lastShotTime = now;
                }
            },

            shoot() {
                const aliveEnemies = this.list.filter(e => e.alive);
                if (aliveEnemies.length === 0) return;
                
                const shooter = aliveEnemies[Math.floor(Math.random() * aliveEnemies.length)];
                bullets.createEnemyBullet(shooter.x + shooter.width / 2 - 3, shooter.y + shooter.height);
            },

            draw() {
                for (const enemy of this.list) {
                    if (enemy.alive) {
                        ctx.save();
                        
                        if (enemy.type === 2) {
                            ctx.fillStyle = '#ff6b35';
                        } else if (enemy.type === 1) {
                            ctx.fillStyle = '#ff9f43';
                        } else {
                            ctx.fillStyle = '#ffcc5c';
                        }
                        
                        ctx.beginPath();
                        ctx.arc(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, enemy.width / 2 - 5, 0, Math.PI * 2);
                        ctx.fill();
                        
                        ctx.fillStyle = '#000';
                        ctx.beginPath();
                        ctx.arc(enemy.x + enemy.width / 2 - 8, enemy.y + enemy.height / 2 - 3, 5, 0, Math.PI * 2);
                        ctx.arc(enemy.x + enemy.width / 2 + 8, enemy.y + enemy.height / 2 - 3, 5, 0, Math.PI * 2);
                        ctx.fill();
                        
                        ctx.strokeStyle = ctx.fillStyle;
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.moveTo(enemy.x + 5, enemy.y + enemy.height / 2);
                        ctx.lineTo(enemy.x - 5, enemy.y + enemy.height / 2 - 10);
                        ctx.moveTo(enemy.x + enemy.width - 5, enemy.y + enemy.height / 2);
                        ctx.lineTo(enemy.x + enemy.width + 5, enemy.y + enemy.height / 2 - 10);
                        ctx.stroke();
                        
                        ctx.restore();
                    }
                }
            },

            getAliveEnemies() {
                return this.list.filter(e => e.alive);
            },

            hasReachedBottom() {
                for (const enemy of this.list) {
                    if (enemy.alive && enemy.y + enemy.height >= player.y) {
                        return true;
                    }
                }
                return false;
            }
        };

        // ==================== 碰撞模块 ====================
        const collision = {
            check(rect1, rect2) {
                return rect1.x < rect2.x + rect2.width &&
                       rect1.x + rect1.width > rect2.x &&
                       rect1.y < rect2.y + rect2.height &&
                       rect1.y + rect1.height > rect2.y;
            },

            checkPlayerBullets() {
                for (let i = bullets.playerBullets.length - 1; i >= 0; i--) {
                    const bullet = bullets.playerBullets[i];
                    
                    for (const enemy of enemies.list) {
                        if (enemy.alive) {
                            if (this.check(bullet, enemy)) {
                                enemy.alive = false;
                                bullets.playerBullets.splice(i, 1);
                                scoreSystem.addScore(10 * (enemy.type + 1));
                                
                                if (enemies.getAliveEnemies().length === 0) {
                                    endGame();
                                }
                                break;
                            }
                        }
                    }
                }
            },

            checkEnemyBullets() {
                for (let i = bullets.enemyBullets.length - 1; i >= 0; i--) {
                    const bullet = bullets.enemyBullets[i];
                    
                    if (this.check(bullet, player.getHitbox())) {
                        bullets.enemyBullets.splice(i, 1);
                        return true;
                    }
                }
                return false;
            },

            checkEnemyCollision() {
                const playerHitbox = player.getHitbox();
                for (const enemy of enemies.list) {
                    if (enemy.alive && this.check(enemy, playerHitbox)) {
                        return true;
                    }
                }
                return false;
            },

            checkAll() {
                this.checkPlayerBullets();
                
                if (this.checkEnemyBullets()) {
                    return true;
                }
                
                if (this.checkEnemyCollision()) {
                    return true;
                }
                
                if (enemies.hasReachedBottom()) {
                    return true;
                }
                
                return false;
            }
        };

        // ==================== 计分模块 ====================
        const scoreSystem = {
            reset() {
                score = 0;
                this.updateDisplay();
            },

            addScore(points) {
                score += points;
                this.updateDisplay();
            },

            updateDisplay() {
                scoreElement.textContent = `分数: ${score}`;
            },

            showFinalScore() {
                finalScoreDiv.textContent = `最终得分: ${score}`;
                finalScoreDiv.style.display = 'block';
            }
        };

        // ==================== 星星背景模块 ====================
        const stars = {
            list: [],

            init() {
                this.list = [];
                for (let i = 0; i < 100; i++) {
                    this.list.push({
                        x: Math.random() * CONFIG.WIDTH,
                        y: Math.random() * CONFIG.HEIGHT,
                        size: 1 + Math.random() * 2,
                        speed: 0.5 + Math.random() * 1
                    });
                }
            },

            update() {
                for (const star of this.list) {
                    star.y += star.speed;
                    if (star.y > CONFIG.HEIGHT) {
                        star.y = 0;
                        star.x = Math.random() * CONFIG.WIDTH;
                    }
                }
            },

            draw() {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                for (const star of this.list) {
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        };

        // ==================== 游戏控制模块 ====================
        function startGame() {
            gameStateManager.setState(GameState.PLAYING);
            overlay.classList.add('hidden');
            finalScoreDiv.style.display = 'none';
            restartBtn.style.display = 'none';
            startMessage.textContent = '按 空格键 开始游戏';
            instructionText.textContent = '提示: ← → 移动飞船，空格键 发射子弹';
            
            player.reset();
            bullets.reset();
            enemies.reset();
            scoreSystem.reset();
            
            gameLoop();
        }

        function endGame() {
            gameStateManager.setState(GameState.GAME_OVER);
            cancelAnimationFrame(animationId);
            scoreSystem.showFinalScore();
            startMessage.textContent = '游戏结束！';
            instructionText.textContent = '按 空格键 或点击按钮重新开始';
            restartBtn.style.display = 'block';
            overlay.classList.remove('hidden');
        }

        // ==================== 事件监听 ====================
        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            
            if (e.code === 'Space') {
                e.preventDefault();
                if (gameState === GameState.READY || gameState === GameState.GAME_OVER) {
                    startGame();
                } else if (gameState === GameState.PLAYING) {
                    player.shoot();
                }
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        restartBtn.addEventListener('click', () => {
            startGame();
        });

        // ==================== 主游戏循环 ====================
        function gameLoop() {
            ctx.fillStyle = '#0a0a23';
            ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);

            stars.update();
            stars.draw();

            if (gameStateManager.isPlaying()) {
                player.update();
                bullets.update();
                enemies.update();

                if (collision.checkAll()) {
                    endGame();
                    return;
                }
            }

            stars.draw();
            enemies.draw();
            bullets.draw();
            player.draw();

            animationId = requestAnimationFrame(gameLoop);
        }

        // ==================== 初始化 ====================
        stars.init();
        
        ctx.fillStyle = '#0a0a23';
        ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);
        stars.draw();
        enemies.init();
        enemies.draw();
        player.draw();
    </script>
</body>
</html>
