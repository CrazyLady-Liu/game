<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>恐龙跑酷</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 50%, #F7F7F7 100%);
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            border: 4px solid #535353;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        #gameCanvas {
            display: block;
            background-color: #f7f7f7;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: rgba(247, 247, 247, 0.95);
            text-align: center;
            z-index: 10;
            transition: opacity 0.3s;
        }
        #overlay.hidden {
            display: none;
        }
        #overlay h1 {
            font-size: 56px;
            color: #535353;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0px #ccc;
        }
        #overlay p {
            font-size: 22px;
            color: #535353;
            margin-bottom: 30px;
        }
        #finalScore {
            font-size: 42px;
            color: #535353;
            margin: 20px 0;
            font-weight: bold;
        }
        #score {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 28px;
            color: #535353;
            font-weight: bold;
            text-shadow: 1px 1px 0px #fff;
            z-index: 5;
        }
        .instruction {
            font-size: 16px;
            color: #888;
            margin-top: 20px;
        }
        .restart-btn {
            padding: 15px 40px;
            font-size: 20px;
            background: #535353;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            font-family: 'Courier New', monospace;
            transition: background 0.3s;
        }
        .restart-btn:hover {
            background: #333;
        }
        .restart-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="900" height="500"></canvas>
        <div id="score">分数: 0</div>
        <div id="overlay">
            <h1>🦕 恐龙跑酷</h1>
            <p id="start-message">按 空格键 开始游戏</p>
            <div id="final-score" style="display: none; font-size: 42px; color: #535353; margin: 20px 0; font-weight: bold;"></div>
            <button id="restart-btn" class="restart-btn" style="display: none;">重新开始</button>
            <div class="instruction" id="instruction-text">提示: 空格键 跳跃躲避仙人掌</div>
        </div>
    </div>

    <script>
        // ==================== 初始化模块 ====================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const overlay = document.getElementById('overlay');
        const restartBtn = document.getElementById('restart-btn');
        const finalScoreDiv = document.getElementById('final-score');
        const startMessage = document.getElementById('start-message');
        const instructionText = document.getElementById('instruction-text');

        const CONFIG = {
            WIDTH: 900,
            HEIGHT: 500,
            GROUND_Y: 400,
            GRAVITY: 0.9,
            BASE_SPEED: 6,
            MAX_SPEED: 15,
            SPEED_INCREMENT: 0.001,
            MIN_SPAWN_INTERVAL: 800,
            MAX_SPAWN_INTERVAL: 2000
        };

        const GameState = {
            READY: 'ready',
            PLAYING: 'playing',
            GAME_OVER: 'gameOver'
        };

        let gameState = GameState.READY;
        let score = 0;
        let animationId = null;
        let gameSpeed = CONFIG.BASE_SPEED;
        let lastTime = 0;

        const resources = {
            loaded: true
        };

        // ==================== 角色模块 ====================
        const dinosaur = {
            x: 120,
            y: CONFIG.GROUND_Y,
            width: 70,
            height: 80,
            velocityY: 0,
            isJumping: false,
            jumpForce: -18,
            animationFrame: 0,
            animationTimer: 0,

            jump() {
                if (!this.isJumping) {
                    this.velocityY = this.jumpForce;
                    this.isJumping = true;
                }
            },

            update(deltaTime) {
                if (this.isJumping) {
                    this.velocityY += CONFIG.GRAVITY;
                    this.y += this.velocityY;

                    if (this.y >= CONFIG.GROUND_Y) {
                        this.y = CONFIG.GROUND_Y;
                        this.velocityY = 0;
                        this.isJumping = false;
                    }
                }

                if (!this.isJumping) {
                    this.animationTimer += deltaTime;
                    if (this.animationTimer > 80) {
                        this.animationTimer = 0;
                        this.animationFrame = (this.animationFrame + 1) % 2;
                    }
                }
            },

            draw() {
                ctx.save();
                
                ctx.fillStyle = '#4A4A4A';
                
                ctx.beginPath();
                ctx.ellipse(this.x + 35, this.y - 45, 30, 25, 0, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.beginPath();
                ctx.ellipse(this.x + 55, this.y - 70, 20, 18, 0.2, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = '#FFFFFF';
                ctx.beginPath();
                ctx.ellipse(this.x + 62, this.y - 72, 6, 6, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#000000';
                ctx.beginPath();
                ctx.arc(this.x + 63, this.y - 72, 3, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.strokeStyle = '#4A4A4A';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(this.x + 70, this.y - 65);
                ctx.lineTo(this.x + 75, this.y - 63);
                ctx.stroke();
                
                ctx.fillStyle = '#4A4A4A';
                const legAngle = this.isJumping ? 0 : Math.sin(this.animationFrame * Math.PI) * 12;
                ctx.fillRect(this.x + 20, this.y - 20 + legAngle, 10, 25);
                ctx.fillRect(this.x + 40, this.y - 20 - legAngle, 10, 25);
                
                ctx.beginPath();
                ctx.moveTo(this.x + 5, this.y - 40);
                ctx.quadraticCurveTo(this.x - 20, this.y - 50, this.x - 15, this.y - 30);
                ctx.lineWidth = 8;
                ctx.strokeStyle = '#4A4A4A';
                ctx.stroke();
                
                ctx.restore();
            },

            reset() {
                this.y = CONFIG.GROUND_Y;
                this.velocityY = 0;
                this.isJumping = false;
                this.animationFrame = 0;
                this.animationTimer = 0;
            },

            getHitbox() {
                return {
                    x: this.x + 15,
                    y: this.y - 65,
                    width: 50,
                    height: 55
                };
            }
        };

        // ==================== 地面模块 ====================
        const ground = {
            tiles: [],
            tileWidth: 80,

            init() {
                this.tiles = [];
                for (let i = 0; i < Math.ceil(CONFIG.WIDTH / this.tileWidth) + 2; i++) {
                    this.tiles.push({ 
                        x: i * this.tileWidth,
                        decorations: this.generateDecorations()
                    });
                }
            },

            generateDecorations() {
                const decs = [];
                for (let j = 0; j < 3; j++) {
                    decs.push({
                        offsetX: Math.random() * this.tileWidth,
                        type: Math.random() > 0.5,
                        size: 3 + Math.random() * 5
                    });
                }
                return decs;
            },

            update() {
                for (let i = 0; i < this.tiles.length; i++) {
                    this.tiles[i].x -= gameSpeed;
                }

                if (this.tiles[0].x + this.tileWidth < 0) {
                    this.tiles.shift();
                    const lastTile = this.tiles[this.tiles.length - 1];
                    this.tiles.push({ 
                        x: lastTile.x + this.tileWidth,
                        decorations: this.generateDecorations()
                    });
                }
            },

            draw() {
                ctx.fillStyle = '#535353';
                ctx.fillRect(0, CONFIG.GROUND_Y + 5, CONFIG.WIDTH, 3);
                
                ctx.fillStyle = '#8B8B8B';
                ctx.fillRect(0, CONFIG.GROUND_Y + 8, CONFIG.WIDTH, 2);
                
                ctx.fillStyle = '#A0A0A0';
                for (const tile of this.tiles) {
                    for (const dec of tile.decorations) {
                        const x = tile.x + dec.offsetX;
                        if (dec.type) {
                            ctx.fillRect(x, CONFIG.GROUND_Y + 12, dec.size, dec.size);
                        } else {
                            ctx.beginPath();
                            ctx.arc(x, CONFIG.GROUND_Y + 14, dec.size / 2, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }
                }
            }
        };

        // ==================== 障碍物模块 ====================
        const obstacles = {
            list: [],
            spawnTimer: 0,

            reset() {
                this.list = [];
                this.spawnTimer = 0;
            },

            getRandomType() {
                const types = [
                    { width: 25, height: 40, arms: true },
                    { width: 35, height: 55, arms: true },
                    { width: 45, height: 65, arms: true },
                    { width: 30, height: 45, arms: false }
                ];
                return types[Math.floor(Math.random() * types.length)];
            },

            spawn() {
                const type = this.getRandomType();
                const newObstacle = {
                    x: CONFIG.WIDTH + 50,
                    y: CONFIG.GROUND_Y,
                    width: type.width,
                    height: type.height,
                    arms: type.arms
                };
                this.list.push(newObstacle);
            },

            update(deltaTime) {
                this.spawnTimer += deltaTime;
                
                const spawnInterval = CONFIG.MIN_SPAWN_INTERVAL + 
                    Math.random() * (CONFIG.MAX_SPAWN_INTERVAL - CONFIG.MIN_SPAWN_INTERVAL);
                
                if (this.spawnTimer > spawnInterval && this.list.length < 5) {
                    this.spawn();
                    this.spawnTimer = 0;
                }

                for (let i = this.list.length - 1; i >= 0; i--) {
                    this.list[i].x -= gameSpeed;

                    if (this.list[i].x + this.list[i].width < -50) {
                        this.list.splice(i, 1);
                    }
                }
            },

            draw() {
                ctx.fillStyle = '#228B22';
                for (const obs of this.list) {
                    ctx.fillRect(obs.x + obs.width * 0.35, obs.y - obs.height, obs.width * 0.3, obs.height);
                    
                    if (obs.arms) {
                        ctx.fillRect(obs.x + obs.width * 0.1, obs.y - obs.height * 0.6, obs.width * 0.25, obs.width * 0.15);
                        ctx.fillRect(obs.x + obs.width * 0.1, obs.y - obs.height * 0.8, obs.width * 0.15, obs.height * 0.25);
                        
                        ctx.fillRect(obs.x + obs.width * 0.65, obs.y - obs.height * 0.4, obs.width * 0.25, obs.width * 0.15);
                        ctx.fillRect(obs.x + obs.width * 0.75, obs.y - obs.height * 0.6, obs.width * 0.15, obs.height * 0.25);
                    }
                    
                    ctx.strokeStyle = '#006400';
                    ctx.lineWidth = 1;
                    for (let i = 0; i < 5; i++) {
                        ctx.beginPath();
                        ctx.moveTo(obs.x + obs.width * 0.35, obs.y - obs.height * (i + 1) * 0.15);
                        ctx.lineTo(obs.x + obs.width * 0.65, obs.y - obs.height * (i + 1) * 0.15);
                        ctx.stroke();
                    }
                }
            },

            getHitboxes() {
                return this.list.map(obs => ({
                    x: obs.x + 5,
                    y: obs.y - obs.height + 5,
                    width: obs.width - 10,
                    height: obs.height - 10
                }));
            }
        };

        // ==================== 背景云模块
        const clouds = {
            list: [],

            init() {
                this.list = [];
                for (let i = 0; i < 5; i++) {
                    this.list.push({
                        x: Math.random() * CONFIG.WIDTH,
                        y: 50 + Math.random() * 100,
                        size: 30 + Math.random() * 40,
                        speed: 0.5 + Math.random() * 1
                    });
                }
            },

            update() {
                for (const cloud of this.list) {
                    cloud.x -= cloud.speed;
                    if (cloud.x + cloud.size * 2 < 0) {
                        cloud.x = CONFIG.WIDTH + cloud.size;
                        cloud.y = 50 + Math.random() * 100;
                    }
                }
            },

            draw() {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                for (const cloud of this.list) {
                    ctx.beginPath();
                    ctx.arc(cloud.x, cloud.y, cloud.size * 0.6, 0, Math.PI * 2);
                    ctx.arc(cloud.x + cloud.size * 0.5, cloud.y - cloud.size * 0.2, cloud.size * 0.5, 0, Math.PI * 2);
                    ctx.arc(cloud.x + cloud.size, cloud.y, cloud.size * 0.7, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        };

        // ==================== 碰撞模块 ====================
        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        function checkGameOver() {
            const dinoHitbox = dinosaur.getHitbox();
            const obsHitboxes = obstacles.getHitboxes();

            for (const obsHitbox of obsHitboxes) {
                if (checkCollision(dinoHitbox, obsHitbox)) {
                    return true;
                }
            }
            return false;
        }

        // ==================== 计分模块 ====================
        const scoreSystem = {
            timer: 0,

            reset() {
                score = 0;
                this.timer = 0;
                this.updateDisplay();
            },

            update(deltaTime) {
                this.timer += deltaTime;
                if (this.timer > 100) {
                    score++;
                    this.timer = 0;
                    this.updateDisplay();
                    
                    if (gameSpeed < CONFIG.MAX_SPEED) {
                        gameSpeed += CONFIG.SPEED_INCREMENT;
                    }
                }
            },

            updateDisplay() {
                scoreElement.textContent = `分数: ${score}`;
            },

            showFinalScore() {
                finalScoreDiv.textContent = `最终得分: ${score}`;
                finalScoreDiv.style.display = 'block';
            }
        };

        // ==================== 状态 & 重启模块 ====================
        function startGame() {
            gameState = GameState.PLAYING;
            overlay.classList.add('hidden');
            finalScoreDiv.style.display = 'none';
            restartBtn.style.display = 'none';
            startMessage.textContent = '按 空格键 开始游戏';
            instructionText.textContent = '提示: 空格键 跳跃躲避仙人掌';
            
            dinosaur.reset();
            ground.init();
            obstacles.reset();
            scoreSystem.reset();
            clouds.init();
            gameSpeed = CONFIG.BASE_SPEED;
            
            lastTime = performance.now();
            gameLoop();
        }

        function endGame() {
            gameState = GameState.GAME_OVER;
            cancelAnimationFrame(animationId);
            scoreSystem.showFinalScore();
            startMessage.textContent = '游戏结束！';
            instructionText.textContent = '按 空格键 或点击按钮重新开始';
            restartBtn.style.display = 'block';
            overlay.classList.remove('hidden');
        }

        function resetGame() {
            dinosaur.reset();
            obstacles.reset();
            scoreSystem.reset();
            gameSpeed = CONFIG.BASE_SPEED;
        }

        // ==================== 事件监听 ====================
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (gameState === GameState.READY || gameState === GameState.GAME_OVER) {
                    startGame();
                } else if (gameState === GameState.PLAYING) {
                    dinosaur.jump();
                }
            }
        });

        restartBtn.addEventListener('click', () => {
            startGame();
        });

        // ==================== 主游戏循环 ====================
        function gameLoop() {
            const currentTime = performance.now();
            const deltaTime = currentTime - lastTime;
            lastTime = currentTime;

            ctx.fillStyle = '#F7F7F7';
            ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);

            const skyGradient = ctx.createLinearGradient(0, 0, 0, CONFIG.GROUND_Y);
            skyGradient.addColorStop(0, '#E0F6FF');
            skyGradient.addColorStop(1, '#F7F7F7');
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.GROUND_Y);

            clouds.update();
            clouds.draw();

            ground.update();
            ground.draw();

            obstacles.update(deltaTime);
            obstacles.draw();

            dinosaur.update(deltaTime);
            dinosaur.draw();

            scoreSystem.update(deltaTime);

            if (checkGameOver()) {
                endGame();
                return;
            }

            animationId = requestAnimationFrame(gameLoop);
        }

        // ==================== 初始化 ====================
        ground.init();
        clouds.init();
        
        ctx.fillStyle = '#F7F7F7';
        ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);
        
        const skyGradient = ctx.createLinearGradient(0, 0, 0, CONFIG.GROUND_Y);
        skyGradient.addColorStop(0, '#E0F6FF');
        skyGradient.addColorStop(1, '#F7F7F7');
        ctx.fillStyle = skyGradient;
        ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.GROUND_Y);
        
        clouds.draw();
        ground.draw();
        dinosaur.draw();
    </script>
</body>
</html>
